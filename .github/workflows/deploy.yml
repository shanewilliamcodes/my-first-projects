name: Deploy to GitHub Pages

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nba-explorer/package-lock.json

      - name: Install dependencies
        working-directory: nba-explorer
        run: npm ci

      - name: Build the NBA Explorer app
        working-directory: nba-explorer
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/nba
          # keep the existing static games at the site root
          cp ./*.html _site/ 2>/dev/null || true
          # the built React app lives under /nba/
          cp -r nba-explorer/dist/* _site/nba/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
